<!doctype html><html lang=ko><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>오늘 뭐 먹지?</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff7ed,#fff);color:#33231e;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:32px 20px 70px}header{font-size:24px;font-weight:800;color:#ff5a36;margin-bottom:70px}.hero{text-align:center}.emoji{font-size:68px}h1{font-size:48px;margin:12px 0;color:#251713}h1 span{color:#ff5a36}p{color:#76645e;font-size:17px}.card{margin-top:42px;background:#fff;padding:32px;border-radius:24px;box-shadow:0 10px 35px #00000012}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}button{padding:16px;border:2px solid #eee;border-radius:14px;background:#fff;font-size:16px;cursor:pointer}button:hover,button.on{border-color:#e53935;background:#fff0eb;color:#d93025;font-weight:800}.find{display:block;margin:32px auto 0;border:0;border-radius:30px;background:#ff5a36;color:#fff;padding:17px 42px;font-weight:800}.result{display:none;margin-top:25px;text-align:center;background:#fff;padding:28px;border-radius:22px;box-shadow:0 10px 35px #00000012}.result h2{color:#ff5a36;font-size:34px}@media(max-width:600px){h1{font-size:36px}.options{grid-template-columns:repeat(2,1fr)}} </style><div class=wrap><header>🍽️ 오늘 뭐 먹지?</header><main class=hero><div class=emoji>🍴</div><h1>오늘은 <span>뭐 먹지?</span></h1><p>원하는 음식 종류를 골라 지금 어울리는 메뉴를 추천받아 보세요.</p><section class=card><h2>🍚 어떤 종류의 음식이 먹고 싶나요?</h2><div class=options><button>🍚 한식</button><button>🥡 중식</button><button>🍣 일식</button><button>🍝 양식</button><button>🍜 분식</button><button>🎲 아무거나</button></div><button class=find>🔍 내 음식 찾기</button></section><section class=result><p>오늘의 추천</p><h2></h2><p>맛있는 한 끼를 즐겨보세요!</p></section></main></div><script>let type='';document.querySelectorAll('.options button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.options button').forEach(x=>x.classList.remove('on'));b.classList.add('on');type=b.textContent.trim()});document.querySelector('.find').onclick=()=>{if(!type)return alert('음식 종류를 먼저 선택해 주세요!');let m={'🍚 한식':['김치찌개','비빔밥','닭갈비'],'🥡 중식':['짜장면','마라탕','마파두부'],'🍣 일식':['돈까스','연어초밥','우동'],'🍝 양식':['파스타','오므라이스','마르게리타 피자'],'🍜 분식':['떡볶이','김밥','라면']};let all=Object.values(m).flat(),a=m[type]||all,r=a[Math.floor(Math.random()*a.length)];document.querySelector('.result h2').textContent=r;document.querySelector('.result').style.display='block';document.querySelector('.result').scrollIntoView({behavior:'smooth'})}</script></html>
